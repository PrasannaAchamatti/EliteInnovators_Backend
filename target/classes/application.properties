# ==========================================
# AssistiveKart - Spring Boot Configuration
# ==========================================

# Server
server.port=${PORT:8080}

# CORS Configuration
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:*}

# MySQL DataSource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/e_commerce?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:pacchu}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# 'none' skips schema validation entirely – safe because the e_commerce DB
# already has the correct tables and we are not managing them from here.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SQL init disabled: e_commerce already has real, populated tables.
# schema.sql/data.sql were only for a fresh demo DB and must not run here.
spring.sql.init.mode=never

# Logging
logging.level.com.assistivekart=INFO
logging.level.org.springframework.web=DEBUG
